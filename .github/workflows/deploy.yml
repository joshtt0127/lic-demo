# Ce workflow vient du dépôt d'origine (danohayon-create) et y déploie sa
# démonstration GitHub Pages. Sur ce fork, Pages n'est pas activé et l'app est
# servie par Vercel : il échouait donc à chaque commit.
#
# Plutôt que de le supprimer — il appartient au dépôt amont, et cette branche a
# vocation à y revenir — on le borne à son dépôt d'origine. Il reste intact
# là-bas, et cesse de peindre ce fork en rouge. Une vérification toujours rouge
# apprend surtout à ne plus regarder les vérifications.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'danohayon-create/lic-demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: true
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
